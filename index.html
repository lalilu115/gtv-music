<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTV Music</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      color: #b3b3b3;
      margin-bottom: 30px;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 15px 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #1db954;
      color: white;
    }

    button:hover {
      background: #1ed760;
    }

    #status {
      margin-top: 25px;
      color: #b3b3b3;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🎵 GTV Music</h1>
    <p>Verbinde dich mit deinem Spotify-Konto.</p>

    <button id="spotifyLogin">
      Mit Spotify verbinden
    </button>

    <div id="status"></div>
  </div>

  <script>
    const CLIENT_ID = "18758e3ae582472a8fd40c3dfd1c454";

    const REDIRECT_URI =
      "https://lalilu115.github.io/gtv-music/";

    const SCOPES = [
      "streaming",
      "user-read-email",
      "user-read-private",
      "user-read-playback-state",
      "user-modify-playback-state"
    ];

    document
      .getElementById("spotifyLogin")
      .addEventListener("click", () => {

        const params = new URLSearchParams({
          client_id: CLIENT_ID,
          response_type: "token",
          redirect_uri: REDIRECT_URI,
          scope: SCOPES.join(" ")
        });

        window.location.href =
          "https://accounts.spotify.com/authorize?" +
          params.toString();
      });
  </script>

</body>
</html>
