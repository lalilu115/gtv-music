<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GTV Music</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #121212;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 50px 0 140px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #b3b3b3;
      margin: 0;
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 13px 22px;
      font-size: 15px;
      font-weight: bold;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: scale(1.02);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .spotify-button {
      background: #1db954;
      color: #ffffff;
    }

    .logout-button {
      background: #333333;
      color: #ffffff;
      margin-left: 8px;
    }

    .login-box {
      text-align: center;
      padding: 35px;
      background: #181818;
      border-radius: 18px;
      margin-bottom: 25px;
    }

    .status {
      margin-top: 18px;
      color: #b3b3b3;
      min-height: 22px;
    }

    .player {
      display: none;
    }

    .player.visible {
      display: block;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      padding: 14px 17px;
      border-radius: 999px;
      border: 1px solid #444;
      background: #242424;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #1db954;
    }

    .search-button {
      background: #ffffff;
      color: #000000;
    }

    .results {
      display: grid;
      gap: 10px;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #181818;
      padding: 12px;
      border-radius: 12px;
    }

    .track img {
      width: 64px;
      height: 64px;
      border-radius: 7px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-name {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-name {
      color: #b3b3b3;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-button {
      background: #1db954;
      color: white;
      flex-shrink: 0;
    }

    .current-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      border-top: 1px solid #333;
      padding: 15px 20px;
      display: none;
      z-index: 10;
    }

    .current-player.visible {
      display: block;
    }

    .current-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .current-cover {
      width: 55px;
      height: 55px;
      border-radius: 5px;
      object-fit: cover;
      background: #333;
    }

    .current-info {
      flex: 1;
      min-width: 0;
    }

    .current-name {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-artist {
      color: #b3b3b3;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .control-button {
      background: #ffffff;
      color: #000000;
    }

    .message {
      text-align: center;
      color: #b3b3b3;
      padding: 25px;
    }

    @media (max-width: 600px) {
      .page {
        padding-top: 30px;
      }

      h1 {
        font-size: 34px;
      }

      .search-box {
        flex-direction: column;
      }

      .track {
        padding: 10px;
      }

      .track img {
        width: 52px;
        height: 52px;
      }

      .play-button {
        padding: 10px 14px;
      }

      .current-inner {
        gap: 10px;
      }

      .current-cover {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header>
      <h1>🎵 GTV Music</h1>
      <p class="subtitle">
        Deine Spotify-Musik direkt im Browser.
      </p>
    </header>

    <section class="login-box">

      <div id="loggedOut">
        <button
          id="loginButton"
          class="spotify-button"
          type="button">
          Mit Spotify verbinden
        </button>

        <div id="loginStatus" class="status">
          Noch nicht mit Spotify verbunden.
        </div>
      </div>

      <div id="loggedIn" style="display:none;">
        <div>
          <strong id="welcomeText">Mit Spotify verbunden</strong>
        </div>

        <div style="margin-top:15px;">
          <button
            id="logoutButton"
            class="logout-button"
            type="button">
            Abmelden
          </button>
        </div>

        <div id="playerStatus" class="status">
          Spotify Player wird gestartet …
        </div>
      </div>

    </section>

    <section id="playerSection" class="player">

      <div class="search-box">

        <input
          id="searchInput"
          type="search"
          placeholder="Song, Künstler oder Album suchen …"
          autocomplete="off">

        <button
          id="searchButton"
          class="search-button"
          type="button">
          Suchen
        </button>

      </div>

      <div id="results" class="results">
        <div class="message">
          Suche nach einem Song.
        </div>
      </div>

    </section>

  </main>

  <div id="currentPlayer" class="current-player">

    <div class="current-inner">

      <img
        id="currentCover"
        class="current-cover"
        src=""
        alt="Albumcover">

      <div class="current-info">

        <div
          id="currentName"
          class="current-name">
          Nichts wird abgespielt
        </div>

        <div
          id="currentArtist"
          class="current-artist">
          —
        </div>

      </div>

      <button
        id="togglePlayButton"
        class="control-button"
        type="button"
        disabled>
        ▶
      </button>

    </div>

  </div>


  <!-- Spotify Web Playback SDK -->
  <script src="https://sdk.scdn.co/spotify-player.js"></script>


  <script>
    /*
     * ============================================================
     * GTV MUSIC
     * Spotify Authorization Code + PKCE
     * ============================================================
     */

    const CLIENT_ID =
      "02696dc4e79b4e5f8c8ee9f2dae3282d";

    const REDIRECT_URI =
      "https://lalilu115.github.io/gtv-music/";


    /*
     * Spotify scopes.
     *
     * streaming:
     *   erforderlich für den Web Playback SDK
     *
     * user-read-private / user-read-email:
     *   Benutzerinformationen
     *
     * user-modify-playback-state:
     *   Wiedergabe starten/ändern
     *
     * user-read-playback-state:
     *   Wiedergabestatus lesen
     */

    const SCOPES = [
      "streaming",
      "user-read-private",
      "user-read-email",
      "user-modify-playback-state",
      "user-read-playback-state"
    ].join(" ");


    let player = null;
    let deviceId = null;
    let currentToken = null;
    let tokenExpiresAt = 0;


    /*
     * ------------------------------------------------------------
     * DOM
     * ------------------------------------------------------------
     */

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const loggedOut =
      document.getElementById("loggedOut");

    const loggedIn =
      document.getElementById("loggedIn");

    const loginStatus =
      document.getElementById("loginStatus");

    const playerStatus =
      document.getElementById("playerStatus");

    const playerSection =
      document.getElementById("playerSection");

    const searchInput =
      document.getElementById("searchInput");

    const searchButton =
      document.getElementById("searchButton");

    const results =
      document.getElementById("results");

    const currentPlayer =
      document.getElementById("currentPlayer");

    const currentCover =
      document.getElementById("currentCover");

    const currentName =
      document.getElementById("currentName");

    const currentArtist =
      document.getElementById("currentArtist");

    const togglePlayButton =
      document.getElementById("togglePlayButton");


    /*
     * ------------------------------------------------------------
     * PKCE
     * ------------------------------------------------------------
     */

    function generateRandomString(length) {

      const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
        "abcdefghijklmnopqrstuvwxyz" +
        "0123456789" +
        "-._~";

      const randomValues =
        crypto.getRandomValues(
          new Uint8Array(length)
        );

      let result = "";

      for (let i = 0; i < length; i++) {
        result += chars[
          randomValues[i] % chars.length
        ];
      }

      return result;
    }


    async function sha256(plainText) {

      const encoder =
        new TextEncoder();

      const data =
        encoder.encode(plainText);

      return crypto.subtle.digest(
        "SHA-256",
        data
      );
    }


    function base64UrlEncode(buffer) {

      let binary = "";

      const bytes =
        new Uint8Array(buffer);

      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }


    async function createCodeChallenge(
      codeVerifier
    ) {

      const hashed =
        await sha256(codeVerifier);

      return base64UrlEncode(hashed);
    }


    /*
     * ------------------------------------------------------------
     * LOGIN
     * ------------------------------------------------------------
     */

    async function login() {

      try {

        loginButton.disabled = true;

        loginStatus.textContent =
          "Spotify Login wird geöffnet …";


        const codeVerifier =
          generateRandomString(64);

        const codeChallenge =
          await createCodeChallenge(
            codeVerifier
          );


        const state =
          generateRandomString(32);


        localStorage.setItem(
          "spotify_code_verifier",
          codeVerifier
        );

        localStorage.setItem(
          "spotify_state",
          state
        );


        const authorizationUrl =
          new URL(
            "https://accounts.spotify.com/authorize"
          );


        authorizationUrl.search =
          new URLSearchParams({

            client_id:
              CLIENT_ID,

            response_type:
              "code",

            redirect_uri:
              REDIRECT_URI,

            scope:
              SCOPES,

            state:
              state,

            code_challenge_method:
              "S256",

            code_challenge:
              codeChallenge

          }).toString();


        window.location.href =
          authorizationUrl.toString();

      } catch (error) {

        console.error(error);

        loginStatus.textContent =
          "Fehler beim Start des Spotify-Logins.";

        loginButton.disabled = false;
      }
    }


    /*
     * ------------------------------------------------------------
     * TOKEN EXCHANGE
     * ------------------------------------------------------------
     */

    async function exchangeCodeForToken(code) {

      const codeVerifier =
        localStorage.getItem(
          "spotify_code_verifier"
        );


      if (!codeVerifier) {
        throw new Error(
          "PKCE code_verifier fehlt."
        );
      }


      const response =
        await fetch(
          "https://accounts.spotify.com/api/token",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              new URLSearchParams({

                client_id:
                  CLIENT_ID,

                grant_type:
                  "authorization_code",

                code:
                  code,

                redirect_uri:
                  REDIRECT_URI,

                code_verifier:
                  codeVerifier

              })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error_description ||
          data.error ||
          "Token-Austausch fehlgeschlagen."
        );
      }


      saveTokens(data);


      localStorage.removeItem(
        "spotify_code_verifier"
      );

      return data;
    }


    /*
     * ------------------------------------------------------------
     * TOKEN STORAGE
     * ------------------------------------------------------------
     */

    function saveTokens(data) {

      if (data.access_token) {

        localStorage.setItem(
          "spotify_access_token",
          data.access_token
        );

        currentToken =
          data.access_token;
      }


      if (data.refresh_token) {

        localStorage.setItem(
          "spotify_refresh_token",
          data.refresh_token
        );
      }


      if (data.expires_in) {

        tokenExpiresAt =
          Date.now() +
          (data.expires_in * 1000);
      }
    }


    /*
     * ------------------------------------------------------------
     * REFRESH TOKEN
     * ------------------------------------------------------------
     */

    async function refreshAccessToken() {

      const refreshToken =
        localStorage.getItem(
          "spotify_refresh_token"
        );


      if (!refreshToken) {
        throw new Error(
          "Kein Refresh Token vorhanden."
        );
      }


      const response =
        await fetch(
          "https://accounts.spotify.com/api/token",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              new URLSearchParams({

                grant_type:
                  "refresh_token",

                refresh_token:
                  refreshToken,

                client_id:
                  CLIENT_ID

              })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        localStorage.removeItem(
          "spotify_access_token"
        );

        localStorage.removeItem(
          "spotify_refresh_token"
        );

        throw new Error(
          data.error_description ||
          data.error ||
          "Token konnte nicht erneuert werden."
        );
      }


      saveTokens(data);

      return data.access_token;
    }


    /*
     * ------------------------------------------------------------
     * GET VALID TOKEN
     * ------------------------------------------------------------
     */

    async function getValidToken() {

      const savedToken =
        localStorage.getItem(
          "spotify_access_token"
        );


      /*
       * Falls der Token noch mindestens
       * 60 Sekunden gültig ist:
       */

      if (
        savedToken &&
        Date.now() <
          tokenExpiresAt - 60000
      ) {

        currentToken =
          savedToken;

        return savedToken;
      }


      /*
       * Wenn kein Ablaufzeitpunkt im Speicher
       * vorhanden ist, versuchen wir zunächst
       * den vorhandenen Token.
       */

      if (
        savedToken &&
        tokenExpiresAt === 0
      ) {

        currentToken =
          savedToken;

        return savedToken;
      }


      return await refreshAccessToken();
    }


    /*
     * ------------------------------------------------------------
     * API HELPER
     * ------------------------------------------------------------
     */

    async function spotifyApi(
      url,
      options = {}
    ) {

      const token =
        await getValidToken();


      const response =
        await fetch(
          url,
          {

            ...options,

            headers: {

              ...(options.headers || {}),

              Authorization:
                "Bearer " + token

            }

          }
        );


      /*
       * Falls der Token abgelaufen ist,
       * einmal erneuern und erneut versuchen.
       */

      if (response.status === 401) {

        const newToken =
          await refreshAccessToken();


        const retryResponse =
          await fetch(
            url,
            {

              ...options,

              headers: {

                ...(options.headers || {}),

                Authorization:
                  "Bearer " + newToken

              }

            }
          );


        if (!retryResponse.ok) {

          throw new Error(
            "Spotify API Fehler: " +
            retryResponse.status
          );
        }


        return retryResponse;
      }


      if (!response.ok) {

        let message =
          "Spotify API Fehler: " +
          response.status;


        try {

          const errorData =
            await response.json();

          if (
            errorData.error &&
            errorData.error.message
          ) {
            message =
              errorData.error.message;
          }

        } catch (_) {}


        throw new Error(message);
      }


      return response;
    }


    /*
     * ------------------------------------------------------------
     * CALLBACK VERARBEITEN
     * ------------------------------------------------------------
     */

    async function handleCallback() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const error =
        params.get("error");

      const code =
        params.get("code");

      const state =
        params.get("state");


      if (error) {

        throw new Error(
          "Spotify Login abgebrochen: " +
          error
        );
      }


      if (!code) {
        return false;
      }


      const savedState =
        localStorage.getItem(
          "spotify_state"
        );


      if (
        !savedState ||
        !state ||
        state !== savedState
      ) {

        throw new Error(
          "Spotify State-Prüfung fehlgeschlagen."
        );
      }


      localStorage.removeItem(
        "spotify_state"
      );


      loginStatus.textContent =
        "Spotify wird verbunden …";


      await exchangeCodeForToken(code);


      /*
       * URL sauber machen:
       * ?code=... soll danach verschwinden.
       */

      window.history.replaceState(
        {},
        document.title,
        REDIRECT_URI
      );


      return true;
    }


    /*
     * ------------------------------------------------------------
     * USER PROFILE
     * ------------------------------------------------------------
     */

    async function loadProfile() {

      const response =
        await spotifyApi(
          "https://api.spotify.com/v1/me"
        );


      const profile =
        await response.json();


      const displayName =
        profile.display_name ||
        "Spotify Benutzer";


      document.getElementById(
        "welcomeText"
      ).textContent =
        "Hallo " +
        displayName +
        " 👋";

    }


    /*
     * ------------------------------------------------------------
     * SPOTIFY PLAYER
     * ------------------------------------------------------------
     */

    function initializePlayer() {

      if (!window.Spotify) {

        playerStatus.textContent =
          "Spotify Player konnte nicht geladen werden.";

        return;
      }


      if (player) {
        return;
      }


      player =
        new Spotify.Player({

          name:
            "GTV Music",

          volume:
            0.7,

          getOAuthToken:
            async callback => {

              try {

                const token =
                  await getValidToken();

                callback(token);

              } catch (error) {

                console.error(error);

                playerStatus.textContent =
                  "Spotify-Anmeldung ist abgelaufen.";

                callback("");
              }

            }

        });


      player.addListener(
        "ready",
        ({ device_id }) => {

          deviceId =
            device_id;

          playerStatus.textContent =
            "Spotify Player ist bereit 🎵";

          togglePlayButton.disabled =
            false;

        }
      );


      player.addListener(
        "not_ready",
        ({ device_id }) => {

          if (deviceId === device_id) {
            deviceId = null;
          }

          playerStatus.textContent =
            "Spotify Player ist momentan nicht verfügbar.";
        }
      );


      player.addListener(
        "initialization_error",
        ({ message }) => {

          console.error(
            "Initialization error:",
            message
          );

          playerStatus.textContent =
            "Player-Fehler: " +
            message;
        }
      );


      player.addListener(
        "authentication_error",
        ({ message }) => {

          console.error(
            "Authentication error:",
            message
          );

          playerStatus.textContent =
            "Spotify-Authentifizierung fehlgeschlagen.";
        }
      );


      player.addListener(
        "account_error",
        ({ message }) => {

          console.error(
            "Account error:",
            message
          );

          playerStatus.textContent =
            "Für den Web Playback Player wird Spotify Premium benötigt.";
        }
      );


      player.addListener(
        "playback_error",
        ({ message }) => {

          console.error(
            "Playback error:",
            message
          );

          playerStatus.textContent =
            "Wiedergabefehler: " +
            message;
        }
      );


      player.addListener(
        "autoplay_failed",
        () => {

          playerStatus.textContent =
            "Der Browser hat automatisches Abspielen blockiert. Drücke Play.";
        }
      );


      player.addListener(
        "player_state_changed",
        state => {

          if (!state) {
            return;
          }


          const track =
            state.track_window.current_track;


          if (!track) {
            return;
          }


          currentName.textContent =
            track.name;

          currentArtist.textContent =
            track.artists
              .map(artist => artist.name)
              .join(", ");


          const image =
            track.album &&
            track.album.images &&
            track.album.images[0];


          if (image) {

            currentCover.src =
              image.url;

          }


          currentPlayer.classList.add(
            "visible"
          );


          togglePlayButton.textContent =
            state.paused
              ? "▶"
              : "⏸";
        }
      );


      player.connect()
        .then(success => {

          if (!success) {

            playerStatus.textContent =
              "Spotify Player konnte nicht verbunden werden.";

          }

        })
        .catch(error => {

          console.error(error);

          playerStatus.textContent =
            "Verbindung zum Spotify Player fehlgeschlagen.";
        });
    }


    /*
     * ------------------------------------------------------------
     * SEARCH
     * ------------------------------------------------------------
     */

    async function searchTracks() {

      const query =
        searchInput.value.trim();


      if (!query) {

        results.innerHTML =
          '<div class="message">Bitte einen Song oder Künstler eingeben.</div>';

        return;
      }


      results.innerHTML =
        '<div class="message">Suche läuft …</div>';


      try {

        const url =
          "https://api.spotify.com/v1/search?" +
          new URLSearchParams({

            q:
              query,

            type:
              "track",

            limit:
              "10"

          });


        const response =
          await spotifyApi(url);


        const data =
          await response.json();


        const tracks =
          data.tracks &&
          data.tracks.items
            ? data.tracks.items
            : [];


        if (!tracks.length) {

          results.innerHTML =
            '<div class="message">Keine Songs gefunden.</div>';

          return;
        }


        results.innerHTML = "";


        tracks.forEach(track => {

          const element =
            document.createElement("div");

          element.className =
            "track";


          const image =
            track.album &&
            track.album.images &&
            track.album.images[0]
              ? track.album.images[0].url
              : "";


          const artists =
            track.artists
              .map(artist => artist.name)
              .join(", ");


          element.innerHTML = `

            <img
              src="${escapeHtml(image)}"
              alt="Albumcover">

            <div class="track-info">

              <div class="track-name">
                ${escapeHtml(track.name)}
              </div>

              <div class="artist-name">
                ${escapeHtml(artists)}
              </div>

            </div>

            <button
              class="play-button"
              type="button">
              ▶ Play
            </button>

          `;


          const playButton =
            element.querySelector(
              ".play-button"
            );


          playButton.addEventListener(
            "click",
            () => {

              playTrack(
                track.uri,
                track.name,
                artists,
                image
              );

            }
          );


          results.appendChild(element);

        });

      } catch (error) {

        console.error(error);

        results.innerHTML =

          '<div class="message">' +
          escapeHtml(
            error.message ||
            "Suche fehlgeschlagen."
          ) +
          "</div>";
      }
    }


    /*
     * ------------------------------------------------------------
     * PLAY TRACK
     * ------------------------------------------------------------
     */

    async function playTrack(
      trackUri,
      name,
      artist,
      image
    ) {

      if (!deviceId) {

        playerStatus.textContent =
          "Der Spotify Player ist noch nicht bereit.";

        return;
      }


      try {

        playerStatus.textContent =
          "Song wird gestartet …";


        /*
         * Browser kann auf iOS/anderen Geräten
         * eine Benutzeraktion verlangen.
         */

        if (
          player &&
          typeof player.activateElement ===
            "function"
        ) {

          player.activateElement();
        }


        const response =
          await spotifyApi(
            "https://api.spotify.com/v1/me/player/play?device_id=" +
            encodeURIComponent(deviceId),
            {

              method:
                "PUT",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  uris: [
                    trackUri
                  ]

                })

            }
          );


        /*
         * Spotify liefert bei erfolgreicher
         * Wiedergabe normalerweise HTTP 204.
         */

        if (
          response.status !== 204
        ) {

          playerStatus.textContent =
            "Wiedergabe gestartet.";
        }


        currentName.textContent =
          name;

        currentArtist.textContent =
          artist;


        if (image) {
          currentCover.src =
            image;
        }


        currentPlayer.classList.add(
          "visible"
        );


        playerStatus.textContent =
          "Jetzt läuft 🎵";

      } catch (error) {

        console.error(error);

        playerStatus.textContent =
          "Song konnte nicht gestartet werden: " +
          error.message;
      }
    }


    /*
     * ------------------------------------------------------------
     * PLAY / PAUSE
     * ------------------------------------------------------------
     */

    togglePlayButton.addEventListener(
      "click",
      async () => {

        if (!player) {
          return;
        }


        try {

          await player.togglePlay();

        } catch (error) {

          console.error(error);

          playerStatus.textContent =
            "Play/Pause konnte nicht ausgeführt werden.";
        }

      }
    );


    /*
     * ------------------------------------------------------------
     * LOGOUT
     * ------------------------------------------------------------
     */

    logoutButton.addEventListener(
      "click",
      () => {

        localStorage.removeItem(
          "spotify_access_token"
        );

        localStorage.removeItem(
          "spotify_refresh_token"
        );

        localStorage.removeItem(
          "spotify_code_verifier"
        );

        localStorage.removeItem(
          "spotify_state"
        );


        if (player) {

          player.disconnect();

          player = null;
        }


        deviceId = null;
        currentToken = null;
        tokenExpiresAt = 0;


        loggedIn.style.display =
          "none";

        loggedOut.style.display =
          "block";

        playerSection.classList.remove(
          "visible"
        );

        currentPlayer.classList.remove(
          "visible"
        );

        loginStatus.textContent =
          "Erfolgreich abgemeldet.";
      }
    );


    /*
     * ------------------------------------------------------------
     * BUTTONS
     * ------------------------------------------------------------
     */

    loginButton.addEventListener(
      "click",
      login
    );


    searchButton.addEventListener(
      "click",
      searchTracks
    );


    searchInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          searchTracks();
        }

      }
    );


    /*
     * ------------------------------------------------------------
     * HTML ESCAPE
     * ------------------------------------------------------------
     */

    function escapeHtml(value) {

      if (!value) {
        return "";
      }


      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /*
     * ------------------------------------------------------------
     * START
     * ------------------------------------------------------------
     */

    async function startApp() {

      try {

        /*
         * Prüfen, ob wir gerade von Spotify
         * zurückkommen.
         */

        const callbackHandled =
          await handleCallback();


        /*
         * Wenn kein Callback vorhanden ist,
         * schauen wir nach einem bestehenden Login.
         */

        const savedToken =
          localStorage.getItem(
            "spotify_access_token"
          );

        const savedRefreshToken =
          localStorage.getItem(
            "spotify_refresh_token"
          );


        if (
          callbackHandled ||
          savedToken ||
          savedRefreshToken
        ) {

          loggedOut.style.display =
            "none";

          loggedIn.style.display =
            "block";

          playerSection.classList.add(
            "visible"
          );


          try {

            await loadProfile();

          } catch (profileError) {

            console.warn(
              "Profil konnte nicht geladen werden:",
              profileError
            );
          }


          initializePlayer();


        } else {

          loggedOut.style.display =
            "block";

          loggedIn.style.display =
            "none";

          playerSection.classList.remove(
            "visible"
          );
        }

      } catch (error) {

        console.error(error);


        loggedOut.style.display =
          "block";

        loggedIn.style.display =
          "none";


        loginStatus.textContent =
          error.message ||
          "Spotify-Anmeldung fehlgeschlagen.";


        /*
         * Fehlerhafte OAuth-Parameter
         * aus der URL entfernen.
         */

        window.history.replaceState(
          {},
          document.title,
          REDIRECT_URI
        );
      }
    }


    startApp();

  </script>

</body>
